name: Release

# Runs when a version tag is pushed, e.g.: git tag v1.0.0 && git push --tags
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Version tag, e.g. v1.0.0'
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-26

    steps:
      - uses: actions/checkout@v4

      - name: Determine version
        id: version
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "number=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        run: brew install libusb create-dmg

      - name: Test core logic
        # No release without green tests.
        run: swift test --package-path SphairaCoreTests

      - name: Build Release
        run: |
          xcodebuild build \
            -scheme "Sphaira Connect" \
            -configuration Release \
            -destination 'platform=macOS,arch=arm64' \
            -derivedDataPath build

      - name: Package app
        id: package
        run: |
          APP="build/Build/Products/Release/Sphaira Connect.app"
          test -d "$APP" || { echo "App bundle not found"; exit 1; }

          # The signature has to survive packaging — ditto is Apple's supported
          # way; plain zip destroys symlinks and extended attributes.
          ZIP="Sphaira-Connect-${{ steps.version.outputs.number }}-arm64.zip"
          ditto -c -k --sequesterRsrc --keepParent "$APP" "$ZIP"

          # DMG with a window layout and a link to /Applications.
          # create-dmg needs a source directory containing ONLY the app.
          mkdir -p dmg-src && cp -R "$APP" dmg-src/
          DMG="Sphaira-Connect-${{ steps.version.outputs.number }}-arm64.dmg"
          create-dmg \
            --volname "Sphaira Connect" \
            --window-pos 200 120 --window-size 620 400 \
            --icon-size 128 \
            --icon "Sphaira Connect.app" 165 190 \
            --app-drop-link 455 190 \
            --no-internet-enable \
            "$DMG" dmg-src/

          echo "zip=$ZIP" >> "$GITHUB_OUTPUT"
          echo "dmg=$DMG" >> "$GITHUB_OUTPUT"
          echo "sha_zip=$(shasum -a 256 "$ZIP" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          echo "sha_dmg=$(shasum -a 256 "$DMG" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - name: Verify packaged bundles
        run: |
          # ZIP: extract and verify the signature
          rm -rf verify && mkdir verify
          ditto -x -k "${{ steps.package.outputs.zip }}" verify
          codesign --verify --verbose=2 "verify/Sphaira Connect.app"

          # DMG: mount and run the same check, so the ZIP is not the only one tested
          hdiutil attach -nobrowse -quiet "${{ steps.package.outputs.dmg }}"
          test -L "/Volumes/Sphaira Connect/Applications" || { echo "ERROR: /Applications link missing."; exit 1; }
          codesign --verify --verbose=2 "/Volumes/Sphaira Connect/Sphaira Connect.app"

          # Ad-hoc signed means: no team identifier. If one shows up, a developer
          # account leaked into the build.
          if codesign -dv "/Volumes/Sphaira Connect/Sphaira Connect.app" 2>&1 | grep -q '^TeamIdentifier=[^n]'; then
            hdiutil detach "/Volumes/Sphaira Connect" -quiet
            echo "ERROR: bundle carries an Apple team identifier."
            exit 1
          fi
          hdiutil detach "/Volumes/Sphaira Connect" -quiet

      - name: Assemble release notes
        id: notes
        run: |
          NOTES_DIR="release_notes/v${{ steps.version.outputs.number }}"
          {
            if [ -d "$NOTES_DIR" ]; then
              cat "$NOTES_DIR"/macos_build_*.md 2>/dev/null || true
              echo
            fi
            echo "## Installation"
            echo
            echo "Open the **DMG** and drag the app into your Applications folder"
            echo "(or unpack the ZIP). On first launch, right-click → **Open**:"
            echo "the app is ad-hoc signed and not notarised, so Gatekeeper would"
            echo "otherwise refuse to start it."
            echo
            echo "| File | SHA-256 |"
            echo "|---|---|"
            echo "| \`${{ steps.package.outputs.dmg }}\` | \`${{ steps.package.outputs.sha_dmg }}\` |"
            echo "| \`${{ steps.package.outputs.zip }}\` | \`${{ steps.package.outputs.sha_zip }}\` |"
          } > RELEASE_NOTES.md

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.version.outputs.tag }}" \
            "${{ steps.package.outputs.dmg }}" \
            "${{ steps.package.outputs.zip }}" \
            --title "Sphaira Connect ${{ steps.version.outputs.number }}" \
            --notes-file RELEASE_NOTES.md
