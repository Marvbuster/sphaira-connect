name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    # macos-26 is arm64 and ships Xcode 26 — both required, because the app
    # targets macOS 26 and uses glassEffect. Homebrew lives at /opt/homebrew
    # there, which is exactly where OTHER_LDFLAGS points.
    runs-on: macos-26

    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Install dependencies
        # xcbeautify is not guaranteed on the runner image, so install it explicitly.
        run: brew install libusb xcbeautify create-dmg

      - name: Test core logic
        run: swift test --package-path SphairaCoreTests

      - name: Build Debug
        run: |
          xcodebuild build \
            -scheme "Sphaira Connect" \
            -configuration Debug \
            -destination 'platform=macOS,arch=arm64' \
            | xcbeautify --renderer github-actions || exit ${PIPESTATUS[0]}

      - name: Build Release
        run: |
          xcodebuild build \
            -scheme "Sphaira Connect" \
            -configuration Release \
            -destination 'platform=macOS,arch=arm64' \
            -derivedDataPath build \
            | xcbeautify --renderer github-actions || exit ${PIPESTATUS[0]}

      - name: Package test build as DMG
        # So you can get a runnable build without cutting a release. Named after
        # the short commit hash rather than a version number, so test builds are
        # never mistaken for real releases.
        run: |
          APP="build/Build/Products/Release/Sphaira Connect.app"
          mkdir -p dmg-src && cp -R "$APP" dmg-src/
          create-dmg \
            --volname "Sphaira Connect" \
            --window-pos 200 120 --window-size 620 400 \
            --icon-size 128 \
            --icon "Sphaira Connect.app" 165 190 \
            --app-drop-link 455 190 \
            --no-internet-enable \
            "Sphaira-Connect-${GITHUB_SHA:0:7}.dmg" dmg-src/

      - name: Upload test build
        uses: actions/upload-artifact@v4
        with:
          name: Sphaira-Connect-${{ github.sha }}
          path: '*.dmg'
          retention-days: 14
          if-no-files-found: error
