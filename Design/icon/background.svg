<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- Hintergrundebene für Icon Composer. Bewusst nur ein Verlauf, ohne
       Glanzlichter oder Rundungen: Die Kantenform, die Brechung und den
       Lichtreflex legt Icon Composer selbst darüber. -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0"    stop-color="#2E86FF"/>
      <stop offset="0.55" stop-color="#1552C8"/>
      <stop offset="1"    stop-color="#0A2A73"/>
    </linearGradient>
  </defs>
  <rect width="1024" height="1024" fill="url(#sky)"/>
</svg>
