<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- Variante B — abstrakter Handheld mit einfahrendem Pfeil.
       Bewusst reduziert und einfarbig: schlichtes Rechteck mit zwei Balken,
       keine Joy-Con-Kontur, keine Neonfarben, keine Wortmarke. Damit bleibt
       die Form generisch und trägt keine fremden Kennzeichen.
       Vordergrundebene für Icon Composer: reine Fläche, keine Effekte. -->
  <g fill="#FFFFFF">
    <!-- Seitliche Griffe -->
    <rect x="212" y="356" width="104" height="312" rx="52"/>
    <rect x="708" y="356" width="104" height="312" rx="52"/>
    <!-- Gehäuse mit ausgespartem Bildschirm -->
    <path fill-rule="evenodd"
          d="M 356 348
             h 312
             a 28 28 0 0 1 28 28
             v 272
