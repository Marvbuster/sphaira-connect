             h -312
             a 28 28 0 0 1 -28 -28
             v -272
             a 28 28 0 0 1 28 -28 Z
             M 372 404
             v 216
             h 280
             v -216 Z"/>
  </g>
  <!-- Pfeil, fährt von oben in den Bildschirm -->
  <path fill="#FFFFFF"
        d="M 474 120
           L 550 120
           L 550 300
           L 627 300
           L 512 500
           L 397 300
           L 474 300 Z"/>
